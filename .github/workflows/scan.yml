name: Auto-Scan Proxy Indonesia

on:
  schedule:
    - cron: '17 */6 * * *'   # setiap 6 jam
  workflow_dispatch:          # manual trigger dari tab Actions

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python + curl + node
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs >/dev/null
          python3 --version
          curl --version | head -1

      - name: Jalankan auto-scan (scrape + verify Indonesia)
        run: |
          bash run_all.sh

      - name: Commit hasil proxy terbaru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indonesia_proxies.txt raw_proxies.txt
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan — skip commit"
          else
            git commit -m "chore(proxy): auto-scan refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi